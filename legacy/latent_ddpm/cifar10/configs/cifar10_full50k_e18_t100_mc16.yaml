dataset: cifar10
use_full_cifar_train: true
max_train_samples: null
exclude_score_validation_split: false

checkpoint_epoch: 18
report_timestep: 100
code_timestep: 99
mc_k: 16
score_formula: sum(flatten(eps_pred) ** 2)
topk_direction: minimum_score
subset_fraction: 0.10

variants:
  - topk_10
  - quantile_spread_10
train_full: false
reuse_existing_full: true
comparison_mode: equal_steps

corpus_seed: 42
model_seed: 42
eval_seed: 4242
task_seed: 42
forward_seed: 42
subset_seed: 42

score_batch_size: 256
score_chunk_size: 256
num_workers: 0
download: false

task_noise:
  kind: awgn_uniform_sigma
  sigma_min: 0.1
  sigma_max: 0.8
  version: tdncnn_task_awgn_v1

eval_noise:
  kind: awgn_uniform_sigma
  sigma_min: 0.1
  sigma_max: 0.8
  version: eval_awgn_v1

paths:
  score_validation_root: experiments/cifar10_score_degradation_validation_v1
  existing_full_root: experiments/image_lab_replication_v1/cifar10_psnr10-40_s42/main
  full_corpus_root: experiments/image_lab_replication_v1/cifar10_psnr10-40_s42/main/01_corpus
  ddpm_checkpoint: experiments/cifar10_score_degradation_validation_v1/03_ddpm/checkpoints/epoch_018.pt
  output_root: experiments/cifar10_full50k_e18_t100_mc16

downstream:
  model: TDnCNN
  batch_size: 32
  optimizer: Adam
  lr: 0.001
  scheduler: none
  checkpoint_selection: best_train_loss
  total_steps: 7815
  lpips_enabled: true

previous_45k_experiment:
  root: experiments/cifar10_score_degradation_validation_v1/07_downstream_e18_t100_mc16
  rows:
    - variant: Full 45k
      train_size: 45000
      PSNR: 19.7610
      SSIM: 0.5904
      LPIPS: 0.2943
    - variant: Top-K 45k
      train_size: 4500
      PSNR: 19.9386
      SSIM: 0.6109
      LPIPS: 0.2821
    - variant: Quantile 45k
      train_size: 4500
      PSNR: 19.3978
      SSIM: 0.5758
      LPIPS: 0.3288

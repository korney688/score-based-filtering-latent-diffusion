dataset: cifar10
current_cifar_root: experiments/cifar10_score_degradation_validation_v1
filtering_dir: experiments/cifar10_score_degradation_validation_v1/06_filtering_e18_t100_mc16
tdncnn_root: experiments/cifar10_score_degradation_validation_v1/07_downstream_e18_t100_mc16
source_drunet_root: experiments/cifar10_score_degradation_validation_v1/drunet
output_dir: experiments/cifar10_score_degradation_validation_v1/drunet/07_early_stopping_ablation
external_benchmark_root: data/external_benchmarks

selected_score_config:
  checkpoint_epoch: 18
  report_timestep: 100
  code_timestep_index: 99
  mc_k: 16
  subset_fraction: 0.10
  scientific_classification: legacy_latent_score_result

model:
  architecture: DRUNet
  official: true
  in_channels: 3
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose

training:
  comparison_mode: equal_max_optimizer_steps_with_validation_early_stopping
  initial_state_scope: shared_drunet_full_topk_quantile
  initial_state_path: experiments/cifar10_score_degradation_validation_v1/drunet/00_audit/initial_state_dict.pt
  batch_size: 16
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0
  scheduler: none
  max_optimizer_steps: 42195
  checkpoint_interval_steps: 100
  validation_interval_steps: 1000
  num_workers: 0
  model_seed: 42
  task_seed: 42
  task_noise:
    kind: awgn_uniform_sigma
    sigma_min: 0.1
    sigma_max: 0.8
    version: tdncnn_task_awgn_v1
  validation_task_noise_version_suffix: _validation

early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience_values: [10]
  min_delta: 0.0001
  warmup_steps: 3000

evaluation:
  batch_size: 32
  lpips_enabled: true
  eval_noise:
    kind: awgn_uniform_sigma
    sigma_min: 0.1
    sigma_max: 0.8
    version: eval_awgn_v1

external:
  benchmarks: [Kodak24, CBSD68, Urban100]
  sigma: 25
  sigma_normalized: 0.09803921568627451
  seed: 42
  lpips_enabled: true
  qualitative_count: 1

smoke:
  output_dir: tmp/cifar10_drunet_early_stopping_ablation_smoke
  official: false
  train_steps: 3
  validation_interval_steps: 1
  warmup_steps: 0
  max_train_items: 8
  max_eval_images: 2
  max_external_images: 1
